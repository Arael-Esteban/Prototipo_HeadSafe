<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">HeadSafe: conexiones y comunicación Wi-Fi</title>
<desc id="desc">El MPU6050 se comunica por I2C con la ESP32: SDA a GPIO26 y SCL a GPIO27. LED rojo en GPIO12, LED verde en GPIO14, buzzer con etapa de manejo en GPIO33 y botón a GND en GPIO25. El navegador se conecta por Wi-Fi a la ESP32. Diagrama lógico, no representa la disposición física de la placa.</desc>
<defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#193149" stroke-width=".5"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#b7ed34" stroke-width="1.3"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#071524"/><rect width="1000" height="620" rx="18" fill="url(#grid)"/>
<g font-family="Arial,sans-serif" fill="#fff"><text x="36" y="45" font-size="25" font-weight="700">HEAD<tspan fill="#b7ed34">SAFE</tspan><tspan dx="18" fill="#9fb2c5" font-size="17" font-weight="400">ESP32 · CONEXIONES LÓGICAS</tspan></text>
<g fill="none" stroke="#12b6d8" stroke-width="2"><path d="M265 162H365"/><path d="M265 206H365"/></g>
<g fill="none" stroke="#b7ed34" stroke-width="2"><path d="M635 154H735"/><path d="M635 218H735"/><path d="M635 282H735"/><path d="M635 346H735"/><path d="M500 385V451" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g>
<rect x="35" y="107" width="230" height="162" rx="12" fill="#10283c" stroke="#12b6d8"/><text x="57" y="138" font-size="22" font-weight="700">MPU-6050</text><text x="57" y="171" font-size="18">SDA</text><text x="57" y="215" font-size="18">SCL</text><text x="57" y="249" font-size="15" fill="#9fb2c5">I2C · dirección 0x68</text>
<rect x="365" y="107" width="270" height="278" rx="12" fill="#10283c" stroke="#b7ed34" stroke-width="2"/><text x="390" y="141" font-size="25" font-weight="700">ESP32 NodeMCU</text><text x="388" y="171" font-size="18" fill="#12b6d8">GPIO26</text><text x="388" y="215" font-size="18" fill="#12b6d8">GPIO27</text><g font-size="18" text-anchor="end" fill="#b7ed34"><text x="615" y="176">GPIO12</text><text x="615" y="240">GPIO14</text><text x="615" y="304">GPIO33</text><text x="615" y="368">GPIO25</text></g><text x="389" y="266" font-size="16" fill="#9fb2c5">Alarma local</text><text x="389" y="291" font-size="16" fill="#9fb2c5">+ servidor web</text><text x="389" y="339" font-size="14" fill="#9fb2c5">No requiere teléfono</text><text x="389" y="359" font-size="14" fill="#9fb2c5">como sensor.</text>
<g fill="#10283c" stroke="#345069"><rect x="735" y="124" width="230" height="53" rx="9"/><rect x="735" y="188" width="230" height="53" rx="9"/><rect x="735" y="252" width="230" height="53" rx="9"/><rect x="735" y="316" width="230" height="67" rx="9"/></g><g font-size="17"><text x="751" y="156">LED rojo + resistencia</text><text x="751" y="220">LED verde + resistencia</text><text x="751" y="284">Buzzer + driver*</text><text x="751" y="342">Botón a GND</text><text x="751" y="366" font-size="14" fill="#9fb2c5">Pull-up interna · activo LOW</text></g>
<text x="522" y="424" font-size="16" fill="#b7ed34">Wi-Fi local · HTTP</text><rect x="258" y="454" width="484" height="77" rx="12" fill="#10283c" stroke="#12b6d8"/><text x="500" y="485" font-size="21" text-anchor="middle" font-weight="700">Navegador de computadora o móvil</text><text x="500" y="512" font-size="17" text-anchor="middle" fill="#9fb2c5">Lecturas, historial y restablecimiento remoto</text>
<g font-size="14" fill="#aebfce"><text x="36" y="563">Masa común. Niveles I2C compatibles con 3,3 V. Alimentación según el módulo utilizado.</text><text x="36" y="585">* Usa etapa de manejo si la carga lo requiere. GPIO12 afecta al arranque: revisa el montaje de tu placa.</text></g></g></svg>
